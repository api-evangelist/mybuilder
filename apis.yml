aid: mybuilder
name: MyBuilder
description: >-
  MyBuilder is a UK online marketplace that connects homeowners with local,
  reviewed tradespeople for home improvement, repair and maintenance work.
  Founded in 2004 by stonemason Ryan Notz and headquartered in London, the
  platform lets homeowners post a job for free, review interested tradespeople by
  their profiles, work history and customer feedback, and shortlist the ones they
  want to hire. Tradespeople browse leads for free and pay a fee only when a
  customer shortlists them. MyBuilder was acquired by IAC's HomeAdvisor in 2017
  and now operates as part of the Instapro Group of European home-services
  marketplaces. MyBuilder is a consumer-facing web platform and does not publish
  a public developer API; this profile captures its public identity, security
  and domain posture.
